# CitéVision base Frigate config — cameras/zones are generated (never edit by hand).
mqtt:
  enabled: true
  host: 127.0.0.1
  port: 1884

database:
  path: /media/frigate/frigate.db

record:
  enabled: false
  retain:
    days: 1
    mode: motion
  events:
    retain:
      default: 1
      mode: motion

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 1

detect:
  enabled: true
  fps: 10

# GPU ONNX detector (RTX) — avoids CPU detector saturating the host.
# Requires: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml
# and model at infra/frigate-config/model_cache/yolov9-t-320.onnx
detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  path: /config/model_cache/yolov9-t-320.onnx
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  labelmap_path: /labelmap/coco-80.txt


# Vehicle tracking for evidence correlation + Frigate-primary bridges.
# Speed estimation uses zone distances (synced from CiteVision when 4-point + edge_distances_m).
# ui.unit_system must be metric for km/h estimates.
objects:
  track:
    - car
    - truck
    - motorcycle
    - bus
    - van

ui:
  unit_system: metric

lpr:
  enabled: false

# Frigate embarque go2rtc sur l'hôte (network_mode: host). Ports dédiés pour ne pas
# bloquer le conteneur citevision-v2-go2rtc (1984/8554/8555) qui sert les boucles démo.
go2rtc:
  api:
    listen: ":1985"
  rtsp:
    listen: ":8557"
  webrtc:
    listen: ":8556"

cameras: {}
